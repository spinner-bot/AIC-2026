<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>

    <!-- 主标题渐变 -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#00d4ff;#7b2ff7;#00d4ff" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1">
        <animate attributeName="stop-color" values="#7b2ff7;#ff006e;#7b2ff7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff006e;#00d4ff;#ff006e" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>

  <!-- 动态粒子背景 -->
  <g opacity="0.4">
    <circle cx="100" cy="80" r="1.5" fill="#00d4ff">
      <animate attributeName="cy" values="80;320;80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="150" r="1" fill="#7b2ff7">
      <animate attributeName="cy" values="150;380;150" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="50" r="1.5" fill="#ff006e">
      <animate attributeName="cy" values="50;350;50" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="200" r="1" fill="#00d4ff">
      <animate attributeName="cy" values="200;400;200" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="100" r="1.5" fill="#7b2ff7">
      <animate attributeName="cy" values="100;380;100" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="300" r="1" fill="#ff006e">
      <animate attributeName="cy" values="300;50;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="250" r="1.5" fill="#00d4ff">
      <animate attributeName="cy" values="250;30;250" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="350" r="1" fill="#7b2ff7">
      <animate attributeName="cy" values="350;100;350" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 装饰线条 - 左上 -->
  <g opacity="0.3">
    <line x1="0" y1="0" x2="120" y2="120" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="80" y2="150" stroke="#7b2ff7" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 装饰线条 - 右下 -->
  <g opacity="0.3">
    <line x1="800" y1="400" x2="680" y2="280" stroke="#ff006e" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="400" x2="720" y2="250" stroke="#00d4ff" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 主标题 -->
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold"
        fill="url(#titleGradient)" text-anchor="middle" filter="url(#strongGlow)">
    AIC-2026
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- 装饰分隔线 -->
  <g>
    <line x1="250" y1="150" x2="550" y2="150" stroke="url(#titleGradient)" stroke-width="2" opacity="0.6">
      <animate attributeName="x1" values="400;250" dur="1.5s" fill="freeze"/>
      <animate attributeName="x2" values="400;550" dur="1.5s" fill="freeze"/>
    </line>
  </g>

  <!-- 正文内容 - 分行显示，逐行淡入 -->
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="18" fill="#e0e0e0" text-anchor="middle" opacity="0">
    We are the true challengers,
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>

  <text x="400" y="230" font-family="Arial, sans-serif" font-size="18" fill="#e0e0e0" text-anchor="middle" opacity="0">
    masters of conquering all that stands before us.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>
  </text>

  <text x="400" y="265" font-family="Arial, sans-serif" font-size="18" fill="#b0b0b0" text-anchor="middle" font-style="italic" opacity="0">
    Adversity is never an impediment in our eyes —
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <text x="400" y="295" font-family="Arial, sans-serif" font-size="18" fill="#b0b0b0" text-anchor="middle" font-style="italic" opacity="0">
    it is the very crucible in which we forge our strength.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2s" fill="freeze"/>
  </text>

  <text x="400" y="330" font-family="Arial, sans-serif" font-size="18" fill="#e0e0e0" text-anchor="middle" opacity="0">
    The journey of the challenge itself is a feast worth savoring.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.5s" fill="freeze"/>
  </text>

  <text x="400" y="365" font-family="Arial, sans-serif" font-size="20" fill="url(#titleGradient)" text-anchor="middle" font-weight="bold" filter="url(#glow)" opacity="0">
    Now assembled and fully ignited, we set forth — to wage war for vengeance.
    <animate attributeName="opacity" values="0;1" dur="1s" begin="3s" fill="freeze"/>
  </text>

  <!-- 底部装饰光点 -->
  <circle cx="400" cy="390" r="3" fill="#00d4ff" opacity="0.8">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
