# CAPR-CLIP V6：全量微调 @ 384 + exact-dup 清洗 + 更长调度（冲 78~79 / 对应干净分 ~80）
#
# 相对 v4 的三处升级（正交、互不干扰）：
#   1. image_size 224 → 384：ViT-B/32 patch 7×7 → 12×12，细粒度判别力显著提升
#   2. exclude_dup_conflict: true：剔除 2095 张 exact-dup 标签冲突的确定性噪声
#   3. robust_epochs 40 → 50：给足时间适应插值位置编码 + 细粒度特征
#
# 注意：与 v3 的 288+hard-drop 回退不同——这里不砍 q0 低分样本（那是 25% 误伤），
# 只砍字节级重复且跨类的铁证噪声（2.25%）。

experiment:
  name: capr_v6_384_dup
  seed: 42
  output_dir: outputs/capr_v6_384_dup

data:
  train_dir: data/train
  test_list: data/test.txt
  num_classes: 500
  image_size: 384
  allow_truncated_images: true
  exclude_dup_conflict: true

audit:
  manifest_path: null
  anomaly_path: null
  file_hash: sha256
  phash_size: 8
  near_dup_hamming: 8
  group_split: true
  val_ratio: 0.10
  oof_folds: 3
  head_quantile: 0.33
  tail_quantile: 0.33
  min_samples_for_split: 10

features:
  cache_dir: null
  backbone: ViT-B/32
  weights_source: openai
  batch_size: 64
  num_workers: 4
  knn_k: [20, 50]
  use_faiss: true

trust:
  oof_folds: 3
  knn_k: 20
  use_oof_classifier: true
  use_leave_one_out_prototype: true
  use_mutual_knn: true
  use_gmm: false
  gmm_min_component: 100
  normalize_within_class: true
  signal_weights: {cls: 1.0, proto: 1.0, knn: 1.0}
  conflict_lambda: 0.1
  q_min: 0.0
  min_effective_count: 5.0

model:
  backbone: ViT-B/32
  classifier: cosine
  finetune_mode: full

train:
  head_warmup_epochs: 5
  robust_epochs: 50
  early_stop_patience: 8
  crt_epochs: 5
  batch_size: 64
  num_workers: 4
  grad_accumulation_steps: 4
  amp: true
  grad_scaler_init_scale: 2048
  optimizer: adamw
  weight_decay: 0.05
  grad_clip_norm: 1.0
  lr: {classifier: 0.0001, backbone: 0.00003, layer_norm: 0.00003}
  scheduler: {name: cosine, warmup_ratio: 0.05}

loss:
  supervised: ce_plain
  label_smoothing: 0.1
  mixup_alpha: 0.2
  anchor:
    min_weight: 0.0
    uncertain_weight: 0.0

noise:
  hard_drop: false

long_tail:
  method: crt
  representation_sampling: natural

inference:
  checkpoint: null
  center_crop: true
  tta: false
  output_csv: pred_results.csv
