# CAPR-CLIP V5：全量微调 + exact-dup 冲突清洗
#
# 与 v4_fullft.yaml 唯一差异：exclude_dup_conflict: true。
# 用同一分辨率/损失/调度，单独量化「剔除确定性噪声」的收益（对比 v4 裸跑）。
#
# 附：本配置起已启用 set_seed（入口脚本固定 seed），v4 裸跑为未种子版本，
# 两者对比时有 ~0.1~0.3pp 的种子噪声，属可接受范围。

experiment:
  name: capr_v5_dup
  seed: 42
  output_dir: outputs/capr_v5_dup

data:
  train_dir: data/train
  test_list: data/test.txt
  num_classes: 500
  image_size: 224
  allow_truncated_images: true
  exclude_dup_conflict: true    # 剔除 exact-dup（file_hash 相同）标签冲突的确定性噪声

audit:
  manifest_path: null
  anomaly_path: null
  file_hash: sha256
  phash_size: 8
  near_dup_hamming: 8
  group_split: true
  val_ratio: 0.10
  oof_folds: 3
  head_quantile: 0.33
  tail_quantile: 0.33
  min_samples_for_split: 10

features:
  cache_dir: null
  backbone: ViT-B/32
  weights_source: openai
  batch_size: 64
  num_workers: 4
  knn_k: [20, 50]
  use_faiss: true

trust:
  oof_folds: 3
  knn_k: 20
  use_oof_classifier: true
  use_leave_one_out_prototype: true
  use_mutual_knn: true
  use_gmm: false
  gmm_min_component: 100
  normalize_within_class: true
  signal_weights: {cls: 1.0, proto: 1.0, knn: 1.0}
  conflict_lambda: 0.1
  q_min: 0.0
  min_effective_count: 5.0

model:
  backbone: ViT-B/32
  classifier: cosine
  finetune_mode: full

train:
  head_warmup_epochs: 5
  robust_epochs: 40
  early_stop_patience: 5
  crt_epochs: 5
  batch_size: 64
  num_workers: 4
  grad_accumulation_steps: 4
  amp: true
  grad_scaler_init_scale: 2048
  optimizer: adamw
  weight_decay: 0.05
  grad_clip_norm: 1.0
  lr: {classifier: 0.0001, backbone: 0.00003, layer_norm: 0.00003}
  scheduler: {name: cosine, warmup_ratio: 0.05}

loss:
  supervised: ce_plain
  label_smoothing: 0.1
  mixup_alpha: 0.2
  anchor:
    min_weight: 0.0
    uncertain_weight: 0.0

noise:
  hard_drop: false

long_tail:
  method: crt
  representation_sampling: natural

inference:
  checkpoint: null
  center_crop: true
  tta: false
  output_csv: pred_results.csv
