<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 30" width="600">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#ff006e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 主线条 -->
  <line x1="50" y1="15" x2="550" y2="15" stroke="url(#lineGrad)" stroke-width="1.5" filter="url(#lineGlow)" opacity="0.7"/>

  <!-- 扫光效果 -->
  <line x1="50" y1="15" x2="550" y2="15" stroke="url(#sweepGrad)" stroke-width="2" opacity="0.8"/>

  <!-- 中心菱形装饰 -->
  <g transform="translate(300, 15)">
    <rect x="-5" y="-5" width="10" height="10" fill="#7b2ff7" transform="rotate(45)" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" fill="#ffffff" transform="rotate(45)" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 两侧小点 -->
  <circle cx="180" cy="15" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="15" r="2" fill="#ff006e" opacity="0.6">
    <animate attributeName="r" values="1.5;2.5;1.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
